---
# Deploy all services onto the single fleet host: mando-agent + reconciler, the egress
# gateway, and NATS. This is a personal, single-machine build — there is no separate
# control plane. Prerequisites (on the controller):
#   make dist                                                   # cross-compile binaries -> bin/
#   scripts/gen-dev-certs.sh secrets/fleet-tls <fleet-host-ip>  # dev mTLS PKI
#   printf '%s' "<real-anthropic-key>" > secrets/anthropic.key  # Tier-0 key
# Then:  ansible-playbook deploy.yml
- name: Deploy fleet-host services
  hosts: fleet
  become: true
  gather_facts: false
  roles:
    - role: fleet_agent
      tags: [fleet_agent]
    - role: litellm
      tags: [litellm]
    - role: egress_gateway
      tags: [egress_gateway]
    - role: nats
      tags: [nats]
    - role: temporal
      tags: [temporal]
    - role: control_plane
      tags: [control_plane]
    - role: dashboard
      tags: [dashboard]
