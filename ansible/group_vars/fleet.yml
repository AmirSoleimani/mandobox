---
# Cross-cutting fleet-host configuration.
#
# Pinned artifact versions/checksums live in each role's defaults/main.yml
# (ansible-lint production profile requires role-prefixed var names). This file
# holds the identity, directory layout, and network addressing shared across roles
# and, later, the fleet-agent runtime.

# --- Identity -------------------------------------------------------------------
# The jailer drops the Firecracker process to this uid/gid. Fixed IDs so chroot
# ownership is stable across reprovisions.
fleet_user: fleet
fleet_group: fleet
fleet_uid: 2000
fleet_gid: 2000

# --- Directory layout (PLAN §7, I7) ---------------------------------------------
# Only workspaces survive a VM; everything else is reconstructible from git + image sha.
fleet_root_dir: /var/lib/fleet
fleet_images_dir: "{{ fleet_root_dir }}/images" # golden rootfs cache (content-addressed, RO)
fleet_workspaces_dir: "{{ fleet_root_dir }}/workspaces" # persistent per-session volumes
fleet_kernels_dir: "{{ fleet_root_dir }}/kernels" # guest kernels (vmlinux-<ver>)
fleet_jail_dir: /srv/jailer # jailer chroot base (jailer default)
fleet_run_dir: /run/fleet # runtime state (tmpfs; cleared on reboot)
fleet_vm_state_dir: "{{ fleet_run_dir }}/vms" # per-VM state dirs written by fleet-agent (M2)

# --- Network addressing (PLAN §7.4) ---------------------------------------------
# Per-VM tap devices, point-to-point, no shared bridge (I2/I3). fleet-agent creates
# taps named "<prefix><n>" at launch (M2); the nftables policy matches the tap class.
fleet_guest_iface_prefix: tap

# Supernet fleet-agent carves per-VM /30s from (M2). Single source of truth: the nftables
# masquerade rule and the fleet-agent -guest-subnet flag both derive from this.
fleet_guest_subnet: "172.16.0.0/12"

# fleet-agent mTLS API port (M2). The control plane reaches it; guests must not.
fleet_agent_port: 9443

# Stable host-side service anchor reachable from every guest. The egress proxy (§7.5)
# and the host resolver bind here; guests route to it via their tap gateway.
fleet_host_gw_addr: 172.31.0.1
fleet_host_gw_prefixlen: 32

# Egress proxy (mcp-guardian + LiteLLM) — deployed in a later milestone; the nftables
# policy permits guests to reach this host:port now so the path exists (§10).
fleet_egress_proxy_port: 8080

# Control-plane NATS (Hetzner Cloud CX). PLACEHOLDER — override per environment.
# 203.0.113.0/24 is TEST-NET-3; leaving it here will render a valid-but-inert rule.
fleet_nats_host: 203.0.113.20
fleet_nats_port: 4222

# MMDS link-local (Firecracker metadata service).
fleet_mmds_addr: 169.254.169.254

# Guest→host ports explicitly dropped and counted (default-DROP already covers them;
# the named rules make injection attempts visible in counters). PLAN §7.4. 9443 is the
# fleet-agent mTLS API (M2) — reachable from the control plane, never from a guest.
fleet_blocked_host_ports: [22, 2375, 2376, 4222, 7233, 9090, 9443]
