---
# Fleet host inventory.
#
# The fleet host is a Hetzner *dedicated* box (Robot AX/EX) with /dev/kvm.
# Hetzner Cloud will NOT work — no nested virtualisation (see PLAN §7).
#
# Replace the placeholder below with your host, or keep secrets/real hosts in an
# untracked inventory/local.yml (gitignored) and run:
#   ansible-playbook -i inventory/local.yml site.yml
all:
  children:
    # Single-machine build: one Hetzner dedicated box runs everything
    # (fleet-agent, gateway, NATS, microVMs). No separate control plane.
    fleet:
      hosts:
        fleet-host-01:
          # ansible_host: 203.0.113.10        # <-- set to the real IP/hostname
          ansible_host: 203.0.113.10
          ansible_user: root
