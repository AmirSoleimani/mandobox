---
# Fleet host inventory.
#
# The fleet host is a Hetzner *dedicated* box (Robot AX/EX) with /dev/kvm.
# Hetzner Cloud will NOT work — no nested virtualisation.
#
# Replace the placeholder below with your host, or keep secrets/real hosts in an
# untracked inventory/local.yml (gitignored) and run:
#   ansible-playbook -i inventory/local.yml site.yml
all:
  children:
    # Single-machine build: one Hetzner dedicated box runs everything
    # (mando-agent, gateway, NATS, microVMs). No separate control plane.
    fleet:
      hosts:
        fleet-host-01:
          ansible_host: 203.0.113.10          # <-- set to your server's IP/hostname
          ansible_user: root

          # --- Egress policy (see docs/runbook.md "Egress policy") ---
          # How much of the internet the agent's microVMs can reach. All egress is forced
          # through mando-gateway (nftables); these control what it permits. Apply with:
          #   ansible-playbook -i inventory/hosts.yml deploy.yml --tags egress_gateway
          #
          # Mode: "strict" (default) = allowlist only; "open" = any host, still logged.
          # egress_gateway_mode: open
          #
          # Extra CONNECT hosts, ADDED to the curated built-in list (strict mode). A leading
          # "." matches the domain and all its subdomains.
          # egress_gateway_allowlist:
          #   - registry.mycompany.internal
          #   - .my-cdn.example.com

          # --- Cloudflare Tunnel (optional): a stable HTTPS URL for the Linear (/linear) and
          # GitHub (/webhook) webhook receivers WITHOUT opening an inbound port. See docs/linear.md.
          # One-time on the controller: `cloudflared tunnel login`, `cloudflared tunnel create mando`
          # (copy ~/.cloudflared/<UUID>.json → secrets/cloudflared-credentials.json), then
          # `cloudflared tunnel route dns mando mando.example.com`. Set the two below and apply with:
          #   ansible-playbook -i inventory/hosts.yml deploy.yml --tags cloudflared
          # cloudflared_hostname: mando.example.com
          # cloudflared_tunnel_id: 00000000-0000-0000-0000-000000000000
