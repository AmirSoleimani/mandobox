---
- name: Check the fc-supervisor binary exists on the controller
  ansible.builtin.stat:
    path: "{{ golden_image_supervisor_src }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: golden_image_supervisor_stat

- name: Assert the fc-supervisor binary was built
  ansible.builtin.assert:
    that:
      - golden_image_supervisor_stat.stat.exists
    fail_msg: "Missing {{ golden_image_supervisor_src }}. Run `make dist` on the controller first."
  run_once: true

- name: Install golden-image build dependencies
  ansible.builtin.apt:
    name: "{{ golden_image_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the build library directory
  ansible.builtin.file:
    path: "{{ golden_image_lib_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy the fc-supervisor binary to the host
  ansible.builtin.copy:
    src: "{{ golden_image_supervisor_src }}"
    dest: "{{ golden_image_lib_dir }}/fc-supervisor"
    owner: root
    group: root
    mode: "0755"

# Split, cached build: mkimage.sh (base|assemble) + update-tools.sh (assemble+activate+audit) + the
# pinned tool-versions manifest. A CLI bump re-runs only the fast `assemble` (~1 min), not the base.
- name: Install the split image-build scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../image/{{ item }}"
    dest: "{{ golden_image_lib_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "{{ '0644' if item == 'tools.env' else '0755' }}"
  loop:
    - mkimage.sh
    - update-tools.sh
    - tools.env

# mkimage.sh copies this into the guest rootfs (/usr/local/bin/mando-shot) and installs its
# Playwright/Chromium runtime around it — the browser for visual self-verification (docs/preview.md).
- name: Create the image-build asset directory
  ansible.builtin.file:
    path: "{{ golden_image_lib_dir }}/assets"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the mando-shot asset for the image build
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../image/assets/mando-shot.js"
    dest: "{{ golden_image_lib_dir }}/assets/mando-shot.js"
    owner: root
    group: root
    mode: "0755"

# update-tools.sh builds the cached base on first run (several minutes), then assembles + activates +
# audits. Output is redirected to a host log: npm/node emit non-UTF8 bytes Ansible's deserializer
# rejects. On failure, read /var/log/fleet-image-build.log on the host.
- name: Build/assemble + activate the golden image
  ansible.builtin.shell: "{{ golden_image_lib_dir }}/update-tools.sh >/var/log/fleet-image-build.log 2>&1"
  args:
    executable: /bin/bash
  environment:
    OUT_DIR: "{{ golden_image_out_dir }}"
    BASE_DIR: "{{ golden_image_out_dir | dirname }}/base"
    SIZE_MB: "{{ golden_image_size_mb }}"
  changed_when: true

- name: Read the active image sha
  ansible.builtin.command: "cat {{ golden_image_out_dir }}/current.sha"
  register: golden_image_sha
  changed_when: false

- name: Report the active image
  ansible.builtin.debug:
    msg: "golden image active: rootfs-{{ golden_image_sha.stdout | trim }}.ext4 (current.ext4) in {{ golden_image_out_dir }}"
