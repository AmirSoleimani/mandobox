---
- name: Assert the GitHub App key exists on the controller
  ansible.builtin.stat:
    path: "{{ control_plane_github_app_key_src }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: control_plane_app_key_stat

- name: Assert the webhook secret exists on the controller
  ansible.builtin.stat:
    path: "{{ control_plane_webhook_secret_src }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: control_plane_webhook_stat

- name: Fail if Tier-0 secrets are missing
  ansible.builtin.assert:
    that:
      - control_plane_app_key_stat.stat.exists
      - control_plane_webhook_stat.stat.exists
    fail_msg: >-
      Missing {{ control_plane_github_app_key_src }} or {{ control_plane_webhook_secret_src }}.
      Place the GitHub App private key and generate a webhook secret
      (openssl rand -hex 24 > secrets/webhook-secret) before deploying the control plane.
  run_once: true

- name: Install the control-plane binaries
  ansible.builtin.copy:
    src: "{{ control_plane_dist_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ control_plane_binaries }}"
  notify:
    - Restart mando-worker
    - Restart webhook-rx
    - Restart nats-bridge

- name: Install the GitHub App private key (Tier-0)
  ansible.builtin.copy:
    src: "{{ control_plane_github_app_key_src }}"
    dest: "{{ control_plane_github_app_key }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart mando-worker

- name: Detect NATS per-session auth material
  ansible.builtin.stat:
    path: "{{ control_plane_nats_account_seed_src }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: control_plane_nats_seed_stat

- name: Install NATS per-session auth material for the worker + nats-bridge
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ control_plane_conf_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { name: nats-account.seed, src: "{{ control_plane_nats_account_seed_src }}", mode: "0600" }
    - { name: nats-account.pub, src: "{{ control_plane_nats_account_pub_src }}", mode: "0644" }
    - { name: nats-service.creds, src: "{{ control_plane_nats_service_creds_src }}", mode: "0600" }
  when: control_plane_nats_seed_stat.stat.exists
  no_log: true
  notify:
    - Restart mando-worker
    - Restart nats-bridge

- name: Install the webhook secret env file (Tier-0)
  ansible.builtin.copy:
    content: "GITHUB_WEBHOOK_SECRET={{ lookup('file', control_plane_webhook_secret_src) | trim }}\n"
    dest: "{{ control_plane_conf_dir }}/webhook-secret.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart webhook-rx

- name: Install the worker env file
  ansible.builtin.template:
    src: control-plane.env.j2
    dest: "{{ control_plane_conf_dir }}/control-plane.env"
    owner: root
    group: root
    mode: "0640"
  notify: Restart mando-worker

# ---- Slack (optional): only if all three secrets exist on the controller ----
- name: Check for the Slack secrets on the controller
  ansible.builtin.stat:
    path: "{{ item }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: control_plane_slack_stat
  loop:
    - "{{ control_plane_slack_bot_token_src }}"
    - "{{ control_plane_slack_app_token_src }}"
    - "{{ control_plane_slack_channel_src }}"

- name: Decide whether Slack is configured
  ansible.builtin.set_fact:
    control_plane_slack_enabled: "{{ control_plane_slack_stat.results | map(attribute='stat.exists') | select | list | length == 3 }}"

- name: Install the Slack env file (Tier-0)
  ansible.builtin.copy:
    content: |
      SLACK_BOT_TOKEN={{ lookup('file', control_plane_slack_bot_token_src) | trim }}
      SLACK_APP_TOKEN={{ lookup('file', control_plane_slack_app_token_src) | trim }}
      SLACK_CHANNEL={{ lookup('file', control_plane_slack_channel_src) | trim }}
    dest: "{{ control_plane_conf_dir }}/slack.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: control_plane_slack_enabled
  notify:
    - Restart mando-worker
    - Restart slack-gateway

# ---- Telegram (optional): only if the bot token exists on the controller ----
- name: Check for the Telegram bot token on the controller
  ansible.builtin.stat:
    path: "{{ control_plane_telegram_bot_token_src }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: control_plane_telegram_stat

- name: Check for an optional Telegram default chat on the controller
  ansible.builtin.stat:
    path: "{{ control_plane_telegram_chat_src }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: control_plane_telegram_chat_stat

- name: Decide whether Telegram is configured
  ansible.builtin.set_fact:
    control_plane_telegram_enabled: "{{ control_plane_telegram_stat.stat.exists }}"

- name: Install the Telegram env file (Tier-0)
  ansible.builtin.copy:
    content: |
      TELEGRAM_BOT_TOKEN={{ lookup('file', control_plane_telegram_bot_token_src) | trim }}
      TELEGRAM_DEFAULT_CHAT={{ lookup('file', control_plane_telegram_chat_src) | trim if control_plane_telegram_chat_stat.stat.exists else '' }}
    dest: "{{ control_plane_conf_dir }}/telegram.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: control_plane_telegram_enabled
  notify:
    - Restart mando-worker
    - Restart telegram-gateway

# ---- VS Code tunnel token (optional): only if the controller has one ----
- name: Check for the VS Code tunnel token on the controller
  ansible.builtin.stat:
    path: "{{ control_plane_vscode_tunnel_token_src }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: control_plane_vscode_stat

- name: Install the VS Code tunnel token (injected into guests so attach skips the device login)
  ansible.builtin.copy:
    src: "{{ control_plane_vscode_tunnel_token_src }}"
    dest: "{{ control_plane_vscode_tunnel_token }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: control_plane_vscode_stat.stat.exists
  notify: Restart mando-worker

- name: Create the guest-stream log directory
  ansible.builtin.file:
    path: "{{ control_plane_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install the control-plane systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - mando-worker.service
    - webhook-rx.service
    - nats-bridge.service
    - slack-gateway.service
    - telegram-gateway.service
  notify:
    - Reload systemd daemon (control-plane)
    - Restart mando-worker
    - Restart webhook-rx
    - Restart nats-bridge
    - Restart slack-gateway
    - Restart telegram-gateway

- name: Apply unit changes before enabling
  ansible.builtin.meta: flush_handlers

- name: Enable and start the always-on control-plane services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nats-bridge
    - mando-worker
    - webhook-rx

- name: Enable and start slack-gateway when Slack is configured
  ansible.builtin.systemd_service:
    name: slack-gateway
    enabled: "{{ control_plane_slack_enabled }}"
    state: "{{ 'started' if control_plane_slack_enabled else 'stopped' }}"

- name: Enable and start telegram-gateway when Telegram is configured
  ansible.builtin.systemd_service:
    name: telegram-gateway
    enabled: "{{ control_plane_telegram_enabled }}"
    state: "{{ 'started' if control_plane_telegram_enabled else 'stopped' }}"
