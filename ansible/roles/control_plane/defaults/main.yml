---
# The Temporal control-plane services: mando-worker (PRWorkflow + activities), webhook-rx
# (GitHub webhooks → signals), nats-bridge (guest stream archival). They run on the fleet host
# alongside Temporal and mando-agent. Tier-0 secrets (the GitHub App key, webhook secret) live
# here and never enter a guest.
control_plane_dist_dir: "{{ playbook_dir }}/../bin"
control_plane_conf_dir: /etc/fleet
control_plane_tls_dir: /etc/fleet/tls # installed by the fleet_agent role
control_plane_log_dir: /var/lib/fleet/logs

control_plane_binaries:
  - mando-worker
  - webhook-rx
  - nats-bridge
  - mando-dispatch
  - mando-connectors

# GitHub App — installation-token minting (Tier-0 private key stays host-side).
# Set these to YOUR GitHub App's values (see docs/github-setup.md). Override in a gitignored
# inventory/local.yml or host_vars rather than editing this template.
control_plane_github_app_id: ""                 # your GitHub App's numeric ID
control_plane_github_org: ""                     # the GitHub org your repos live under
control_plane_github_app_key_src: "{{ playbook_dir }}/../secrets/github-app-private-key.pem"

# NATS per-session auth material (generated by `mando-natsauth -out secrets/nats`). Installed only when
# present. The worker mints per-session guest creds from the account seed; worker + nats-bridge connect
# with the service creds. Paths match the worker/bridge env defaults, so no env change is needed.
control_plane_nats_account_seed_src: "{{ playbook_dir }}/../secrets/nats/nats-account.seed"
control_plane_nats_account_pub_src: "{{ playbook_dir }}/../secrets/nats/nats-account.pub"
control_plane_nats_service_creds_src: "{{ playbook_dir }}/../secrets/nats/nats-service.creds"
control_plane_github_app_key: "{{ control_plane_conf_dir }}/github-app.pem"
control_plane_bot_user: "your-app-name[bot]"     # your App's bot login (from the installed App)
control_plane_bot_email: "your-app-name[bot]@users.noreply.github.com"

# Webhook HMAC secret (must match the GitHub App webhook config).
control_plane_webhook_secret_src: "{{ playbook_dir }}/../secrets/webhook-secret"

# Slack (optional — Socket Mode). If these three secrets exist on the controller, the worker
# posts to Slack and the mando-connectors host runs it; otherwise both degrade gracefully (no Slack).
control_plane_slack_bot_token_src: "{{ playbook_dir }}/../secrets/slack-bot-token"
control_plane_slack_app_token_src: "{{ playbook_dir }}/../secrets/slack-app-token"
control_plane_slack_channel_src: "{{ playbook_dir }}/../secrets/slack-channel"

# Telegram (optional — Bot API long-poll). If the bot token exists on the controller, the worker posts
# to Telegram and the mando-connectors host runs it; otherwise both degrade gracefully (no Telegram).
control_plane_telegram_bot_token_src: "{{ playbook_dir }}/../secrets/telegram-bot-token"
control_plane_telegram_chat_src: "{{ playbook_dir }}/../secrets/telegram-chat"
# Linear connector (optional): a personal API key + webhook signing secret enable it. The repo is inferred
# from each issue's text by a cheap LLM (name it as owner/repo); the GitHub App's installed repos are the
# boundary. The allowlist below is OPTIONAL — leave it empty to let the LLM name any App-installed repo, or
# set it to narrow the agent to a specific list (then the LLM must pick one of these).
control_plane_linear_api_key_src: "{{ playbook_dir }}/../secrets/linear-api-key"
control_plane_linear_webhook_secret_src: "{{ playbook_dir }}/../secrets/linear-webhook-secret"
control_plane_linear_repo_allowlist: [] # optional: restrict inference to these owner/name repos
control_plane_linear_default_repo: ""
control_plane_linear_webhook_addr: "0.0.0.0:8089"

# Connector enable/disable config (dashboard-managed connectors.json). Absent/empty → every configured
# connector runs; a dashboard-written {"slack":{"enabled":false}} turns one off.
control_plane_connectors_config: "{{ control_plane_conf_dir }}/connectors.json"

# VS Code tunnel (optional). A pre-authenticated `code tunnel` token — run `code tunnel user login`
# once on the controller and save the resulting token.json to secrets/vscode-tunnel-token.json. If
# present, the worker injects it into every guest so a human attach skips the GitHub device login;
# absent → operators device-login once per VM. Scoped to the operator's tunnels, not a broad
# credential.
control_plane_vscode_tunnel_token_src: "{{ playbook_dir }}/../secrets/vscode-tunnel-token.json"
control_plane_vscode_tunnel_token: "{{ control_plane_conf_dir }}/vscode-tunnel-token.json"

# Box-wide default agent instructions (a plain-text file the worker reads per dispatch and the
# dashboard edits). Applied as the system-prompt addition when a repo's .mandobox.yml sets none.
control_plane_instructions_path: /etc/fleet/agent-instructions.md

# Agent preamble override files (read per launch; the worker materializes the built-in defaults to
# <path>.default for the dashboard). Absent/empty → the guest uses its built-in preamble.
control_plane_preamble_autonomous: /etc/fleet/preamble-autonomous.md
control_plane_preamble_collaborate: /etc/fleet/preamble-collaborate.md
control_plane_preamble_plan: /etc/fleet/preamble-plan.md

# Endpoints — all localhost / host-anchor.
control_plane_temporal_address: "127.0.0.1:7233"
control_plane_temporal_namespace: fleet
control_plane_fleet_url: "https://127.0.0.1:9443"
control_plane_nats_url: "nats://172.31.0.1:4222"
control_plane_gateway_url: "http://172.31.0.1:8080"
# Public so GitHub can deliver webhooks. Every request is HMAC-verified against the webhook
# secret, so only GitHub-signed payloads are honoured; unsigned/forged ones get 401.
control_plane_webhook_addr: "0.0.0.0:8088"
