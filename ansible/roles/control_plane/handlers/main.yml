---
- name: Reload systemd daemon (control-plane)
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart mando-worker
  ansible.builtin.systemd_service:
    name: mando-worker
    state: restarted

- name: Restart webhook-rx
  ansible.builtin.systemd_service:
    name: webhook-rx
    state: restarted

- name: Restart nats-bridge
  ansible.builtin.systemd_service:
    name: nats-bridge
    state: restarted

- name: Restart slack-gateway
  ansible.builtin.systemd_service:
    name: slack-gateway
    state: restarted
