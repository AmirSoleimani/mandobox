---
- name: Install the reaper script
  ansible.builtin.copy:
    src: fleet-reaper
    dest: "{{ reaper_bin }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the reaper service unit
  ansible.builtin.template:
    src: fleet-reaper.service.j2
    dest: /etc/systemd/system/fleet-reaper.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon (reaper)

- name: Install the reaper timer unit
  ansible.builtin.template:
    src: fleet-reaper.timer.j2
    dest: /etc/systemd/system/fleet-reaper.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon (reaper)

# Make a freshly written unit visible before we enable it (idempotent: the handler
# only fires when a unit actually changed).
- name: Reload systemd before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start the reaper timer
  ansible.builtin.systemd_service:
    name: fleet-reaper.timer
    enabled: true
    state: started
