---
reaper_bin: /usr/local/sbin/mando-reaper

# Absolute VM lifetime and heartbeat-staleness thresholds (PLAN §7.6).
reaper_max_lifetime_seconds: 21600 # 6h
reaper_heartbeat_timeout_seconds: 600 # 10m
reaper_term_grace_seconds: 10 # SIGTERM → SIGKILL grace

# How often the timer fires.
reaper_interval: 2min
