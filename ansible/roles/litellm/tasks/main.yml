---
- name: Install Python venv tooling
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the litellm system user
  ansible.builtin.user:
    name: "{{ litellm_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create litellm directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ litellm_user }}"
    group: "{{ litellm_user }}"
    mode: "0755"
  loop:
    - /opt/litellm
    - "{{ litellm_conf_dir }}"

- name: Create the litellm virtualenv
  ansible.builtin.command:
    cmd: python3 -m venv {{ litellm_venv }}
    creates: "{{ litellm_venv }}/bin/python"
  become_user: "{{ litellm_user }}"

# litellm 1.95.0 requires fastapi>=0.136.3 but its proxy imports get_flat_dependant, removed in
# fastapi 0.113 — so we install litellm, then force fastapi back down. Both steps are guarded on
# the installed version: on re-run they SKIP, so pip never re-resolves (which would revert the
# fastapi pin and, as litellm-user, fail). Runs as the litellm user with HOME set (no home dir
# → no writable pip cache) and --no-cache-dir.
- name: Check the installed litellm version
  ansible.builtin.command: "{{ litellm_venv }}/bin/pip show litellm"
  register: litellm_show
  changed_when: false
  failed_when: false

- name: Install litellm[proxy] into the venv
  ansible.builtin.pip:
    name: "litellm[proxy]=={{ litellm_version }}"
    virtualenv: "{{ litellm_venv }}"
    extra_args: --no-cache-dir
  become_user: "{{ litellm_user }}"
  environment:
    HOME: /opt/litellm
  when: "'Version: ' + litellm_version not in litellm_show.stdout"
  notify: Restart litellm

- name: Check the installed fastapi version
  ansible.builtin.command: "{{ litellm_venv }}/bin/pip show fastapi"
  register: litellm_fastapi_show
  changed_when: false
  failed_when: false

- name: Pin a fastapi compatible with the litellm proxy
  ansible.builtin.pip:
    name: "fastapi=={{ litellm_fastapi_pin }}"
    virtualenv: "{{ litellm_venv }}"
    extra_args: --no-cache-dir
  become_user: "{{ litellm_user }}"
  environment:
    HOME: /opt/litellm
  when:
    - litellm_fastapi_pin | length > 0
    - "'Version: ' + litellm_fastapi_pin not in litellm_fastapi_show.stdout"
  notify: Restart litellm

- name: Install the litellm config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ litellm_conf_dir }}/config.yaml"
    owner: "{{ litellm_user }}"
    group: "{{ litellm_user }}"
    mode: "0644"
  notify: Restart litellm

- name: Install the litellm secrets env (Tier-0)
  ansible.builtin.template:
    src: litellm.env.j2
    dest: "{{ litellm_conf_dir }}/litellm.env"
    owner: "{{ litellm_user }}"
    group: "{{ litellm_user }}"
    mode: "0600"
  no_log: true
  notify: Restart litellm

- name: Install the litellm systemd unit
  ansible.builtin.template:
    src: litellm.service.j2
    dest: /etc/systemd/system/litellm.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon (litellm)
    - Restart litellm

- name: Apply unit changes before enabling
  ansible.builtin.meta: flush_handlers

- name: Enable and start litellm
  ansible.builtin.systemd_service:
    name: litellm
    enabled: true
    state: started

- name: Wait for the litellm proxy to accept connections
  ansible.builtin.wait_for:
    host: "{{ litellm_host }}"
    port: "{{ litellm_port }}"
    timeout: 90
