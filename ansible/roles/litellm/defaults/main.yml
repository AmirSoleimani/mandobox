---
# LiteLLM proxy (PLAN §10): the model-routing layer between the egress gateway and the LLM
# providers. Native (pip venv, no Docker), no database — a static model_list + master key only.
# It holds the real provider key(s); the guest never does, and now neither does the gateway
# (which injects only the LiteLLM master key) — one more hop from the guest (I1).
litellm_venv: /opt/litellm/venv
litellm_conf_dir: /etc/litellm
litellm_user: litellm
litellm_host: "127.0.0.1"
litellm_port: 4000
# Pinned to a verified pair. litellm 1.95.0's proxy imports fastapi.get_flat_dependant, which
# fastapi removed in 0.113, but the [proxy] extra resolves fastapi to latest — so we force
# fastapi back down to the last release that still has it. Bump both together after testing.
litellm_version: "1.95.0"
litellm_fastapi_pin: "0.112.4"

# Routing overrides: send a specific model to a specific (possibly non-Anthropic) provider.
# Claude Code sends REAL model IDs (it expands its own aliases like "default"), and also uses a
# small-fast model — so the base is a wildcard passthrough to Anthropic (see config.yaml.j2),
# and these overrides win for named models. Empty by default = pure passthrough. Example, to
# route the cheap class through OpenRouter:
#   - {name: "claude-haiku-4-5-20251001", model: "openrouter/anthropic/claude-3.5-haiku"}
litellm_model_overrides: []

# Secrets (Tier-0, gitignored, host-side only).
litellm_anthropic_key_src: "{{ playbook_dir }}/../secrets/anthropic.key"
litellm_master_key_src: "{{ playbook_dir }}/../secrets/litellm-master-key"
# Optional: an OpenAI key enables the Codex harness (agent: codex). Drop it here and add a gpt route
# to litellm_model_overrides, e.g. {name: "gpt-5-codex", model: "openai/gpt-5-codex"}. Absent → no
# OpenAI routing (the env line below is simply omitted).
litellm_openai_key_src: "{{ playbook_dir }}/../secrets/openai.key"
