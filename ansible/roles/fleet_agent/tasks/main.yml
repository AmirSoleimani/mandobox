---
- name: Check the cross-compiled binaries exist on the controller
  ansible.builtin.stat:
    path: "{{ fleet_agent_dist_dir }}/{{ item }}"
  loop:
    - mando-agent
  delegate_to: localhost
  run_once: true
  become: false
  register: fleet_agent_bin_stat

- name: Assert the binaries were built
  ansible.builtin.assert:
    that:
      - "not (false in (fleet_agent_bin_stat.results | map(attribute='stat.exists') | list))"
    fail_msg: >-
      Missing binaries in {{ fleet_agent_dist_dir }}. Run `make dist` at the repo root to
      cross-compile mando-agent for linux/amd64.
  run_once: true

- name: Check the TLS material exists on the controller
  ansible.builtin.stat:
    path: "{{ fleet_agent_tls_src_dir }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: fleet_agent_tls_stat

- name: Assert the TLS material is present
  ansible.builtin.assert:
    that:
      - fleet_agent_tls_stat.stat.exists
      - fleet_agent_tls_stat.stat.isdir
    fail_msg: >-
      No TLS material at {{ fleet_agent_tls_src_dir }}. Generate a dev PKI with
      `scripts/gen-dev-certs.sh {{ fleet_agent_tls_src_dir }} <fleet-host-ip>`, or point
      fleet_agent_tls_src_dir at your real PKI.
  run_once: true

- name: Create the fleet config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ fleet_agent_conf_dir }}"
    - "{{ fleet_agent_tls_dir }}"

- name: Install the mando-agent binary
  ansible.builtin.copy:
    src: "{{ fleet_agent_dist_dir }}/mando-agent"
    dest: "{{ fleet_agent_bin }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart mando-agent

- name: Install the mando-agent TLS material
  ansible.builtin.copy:
    src: "{{ fleet_agent_tls_src_dir }}/{{ item.name }}"
    dest: "{{ fleet_agent_tls_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ fleet_agent_tls_files }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart mando-agent

# The reconciler.crt/key are the mTLS CLIENT identity for calling mando-agent's /vms API. The
# standalone reconciler is gone (its logic is now the worker's scheduled ReconcileWorkflow), but the
# worker still presents this cert, so it's always installed. A cert rotation needs a worker restart.
- name: Install the fleet-API client TLS material (used by the worker's reconcile + launch)
  ansible.builtin.copy:
    src: "{{ fleet_agent_tls_src_dir }}/{{ item.name }}"
    dest: "{{ fleet_agent_tls_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ fleet_agent_reconciler_tls_files }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install the mando-agent unit
  ansible.builtin.template:
    src: mando-agent.service.j2
    dest: /etc/systemd/system/mando-agent.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon (mando-agent)
    - Restart mando-agent

- name: Apply unit changes before enabling services
  ansible.builtin.meta: flush_handlers

- name: Enable and start mando-agent
  ansible.builtin.systemd_service:
    name: mando-agent
    enabled: true
    state: started
