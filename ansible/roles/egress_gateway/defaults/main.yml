---
egress_gateway_dist_dir: "{{ playbook_dir }}/../bin"
egress_gateway_bin: /usr/local/bin/mando-gateway
egress_gateway_conf_dir: /etc/fleet/gateway

# The upstream credential the gateway injects (Tier-0) — never in a guest. The
# upstream is LiteLLM, so this is the LiteLLM master key; the real Anthropic key lives only in
# the litellm role. Ship it from a local, gitignored file.
egress_gateway_key_src: "{{ playbook_dir }}/../secrets/litellm-master-key"
egress_gateway_key_file: "{{ egress_gateway_conf_dir }}/upstream.key"
# LiteLLM's unambiguous proxy-auth header. Use "X-Api-Key" to talk to Anthropic directly.
egress_gateway_key_header: "x-litellm-api-key"

# LiteLLM proxy (model routing) — localhost. Set to https://api.anthropic.com to bypass routing.
egress_gateway_upstream: "http://127.0.0.1:4000"
# Bind the host service anchor so guests reach it, and it is never on the public interface.
egress_gateway_listen: "{{ fleet_host_gw_addr }}:{{ fleet_egress_proxy_port }}"

# Egress policy:
#   strict → default-deny; only the allowlist (built-in curated registries + egress_gateway_allowlist)
#            may be reached. Best when running untrusted repos.
#   open   → any host reachable, still logged through the gateway (the audited chokepoint stays).
#            Best for your own trusted repos — zero registry maintenance, keeps exfil *detection*.
# nftables forces all guest egress through the gateway in both modes.
egress_gateway_mode: strict

# Optional custom CONNECT allowlist (one host per line), ADDED to the binary's curated built-in
# list when in strict mode. Empty → just the built-in list. Extend for private/niche registries.
egress_gateway_allowlist: []
